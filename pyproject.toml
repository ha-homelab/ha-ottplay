[project]
name = "ha-ottplay"
version = "0.1.1"
description = "Home Assistant media players backed by the OTTPlay Control Server"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.11.0b3",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["custom_components.ottplay"]
omit = ["scripts/*", "tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
