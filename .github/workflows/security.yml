name: Security checks
on:
  workflow_call: {}
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@579fdb4f24e500bf601bc642422787c9be70684c # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
