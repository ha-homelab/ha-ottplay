name: Security checks
on:
  workflow_call: {}
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
