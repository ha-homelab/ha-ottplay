name: Security checks
on:
  workflow_call: {}
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@0047a13b5eb79dfa770e31070a83e9696ddd36d1 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
