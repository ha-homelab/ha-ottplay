name: Security checks
on:
  workflow_call: {}
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@95eb33d1330d4ff43840501688c640dc2c3c12fa # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true
