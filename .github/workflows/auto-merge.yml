name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

# Metadata-only edits must not cancel a meaningful pending approval/merge run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base) && 'state' || github.run_id }}${{ ((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base)) && format('-withdrawal-{0}', github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto-merge:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      (github.event_name == 'pull_request_target' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.base.ref == github.event.repository.default_branch ||
        (github.event.action == 'edited' && github.event.changes.base &&
         github.event.pull_request.base.ref != github.event.repository.default_branch))) &&
      contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@8249b82b506af2e62c03e33ce0990327dd5f55c6 # main
    with:
      native-auto-merge: ${{ !((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref != github.event.repository.default_branch)) }}
      withdrawal-only: ${{ ((github.event.action == 'unlabeled' && github.event.label.name == 'automerge') || github.event.action == 'converted_to_draft' || (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref != github.event.repository.default_branch)) }}
      required-status-checks: CI gate
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
