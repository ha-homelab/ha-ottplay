name: Python tests and quality
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  python:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@8008fd1db4c410640e7abddfc8bc75833cdcd970
    with:
      python-version: '3.14'
      install-dependencies: true
      use-uv-lock: true
      dependency-extras: ''
      run-lint: true
      run-type-check: false
      test-args: tests -q
      coverage-threshold: 80
      coverage-artifact-name: ottplay-python-coverage
