name: Python tests and quality
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  python:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      python-version: '3.14'
      install-dependencies: true
      use-uv-lock: true
      dependency-extras: ''
      run-lint: true
      run-type-check: false
      test-args: tests -q
      coverage-threshold: 80
      coverage-artifact-name: ottplay-python-coverage
